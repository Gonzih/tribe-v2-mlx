[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tribe-v2-mlx"
version = "0.1.0"
description = "TRIBE v2 fMRI prediction pipeline with MLX quantization for Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "mlx>=0.17.0",
    "mlx-lm>=0.16.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "huggingface_hub>=0.22.0",
    "av>=12.0.0",
    "numpy>=1.26.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.0",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tribe_v2_mlx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
